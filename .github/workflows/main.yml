name: 'Update schedule'

# ⚠️注意：请不要在 fork 的仓库中添加 `on: schedule` 定时任务（cron）。
# Forks 可能被大量复制并触发定时执行，当前 GitHub Actions 资源使用已接近上限，
# 大量 fork 的定时任务可能导致工作流被禁用。若需要定时执行，请使用其它部署方式。
#
# ⚠️NOTICE: Do NOT add `on: schedule` cron triggers in forked repositories.
# Forks may multiply scheduled runs and GitHub Actions resource usage is near limits.
# Many scheduled workflows from forks can cause workflows to be disabled.
# If scheduled execution is required, use other deployment methods.

on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ 'ubuntu-26.04' ]
    steps:
      - name: 清除action运行记录（保留10条）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取所有运行记录的ID，按创建时间降序排列（最新的在前）
          gh api repos/${{ github.repository }}/actions/runs \
            --paginate \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .[].id' \
            > all_run_ids.txt

          # 统计总数并跳过前10条（保留最新10条）
          total=$(wc -l < all_run_ids.txt)
          keep=10
          if [ "$total" -le "$keep" ]; then
            echo "当前仅有 $total 条记录，无需删除。"
            exit 0
          fi

          delete_count=$((total - keep))
          echo "将删除 $delete_count 条旧记录..."

          # 从第6行开始读取ID并执行删除
          tail -n +$((keep + 1)) all_run_ids.txt | while read -r run_id; do
            echo "正在删除运行记录 ID: $run_id"
            gh api -X DELETE repos/${{ github.repository }}/actions/runs/$run_id
          done
          echo "清理完成，已保留最新 $keep 条运行记录。"
          
      - name: Set branch name
        id: vars
        run: echo "BRANCH_NAME=${{ github.repository_owner == 'Guovin' && 'gd' || 'master' }}" >> $GITHUB_ENV
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH_NAME }}
      - name: Run with setup-python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          update-environment: true
          cache: 'pipenv'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install pipenv
        run: pip3 install --user pipenv
      - name: Install dependecies
        run: pipenv --python 3.14 && pipenv install --deploy
      - name: Update
        run: pipenv run dev
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Github Action Auto Updated"
            git push --force
          fi
